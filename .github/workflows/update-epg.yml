name: Update Meu EPG

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate XMLTV
        run: python build_epg.py
      - name: Commit updated EPG
        run: |
          if git diff --quiet -- epg.xml pareamentos.csv cobertura.csv; then
            echo "EPG is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml pareamentos.csv cobertura.csv
          git commit -m "Update EPG"
          git push
